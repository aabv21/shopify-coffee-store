on_http_request:
  # req.url.raw_path is un-normalized (keeps percent-encoding literal), unlike
  # req.url.path which ngrok decodes first — checked here so an encoded trick
  # can't slip past as something that merely looks safe once decoded.
  - name: Refuse unsafe path encodings
    expressions:
      - 'req.url.raw_path.contains("%") || req.url.raw_path.contains("\\") || req.url.raw_path.contains("//") || req.url.raw_path.contains("/./") || req.url.raw_path.contains("/../")'
    actions:
      - type: deny
        config:
          status_code: 404
  # Allowlist: only the Shopify Trigger's own fixed webhookId
  # (workflows/shopify-orders.json) gets through, not any webhook-shaped path.
  - name: Forward the Shopify trigger path only
    expressions:
      - '!req.url.raw_path.matches("^/webhook/4b1d2c3e-5f60-4a7b-8c9d-0e1f2a3b4c5d/webhook$")'
    actions:
      - type: deny
        config:
          status_code: 404
