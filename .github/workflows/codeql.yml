name: CodeQL

on:
  pull_request:
  push:
    branches: [main, develop]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    # CodeQL on a private repo needs a paid license; this turns on once the repo goes public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # required by github/codeql-action/analyze to upload results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          # actions analyzes the workflow files themselves, alongside actionlint and zizmor in ci.yml.
          languages: javascript-typescript, actions
          # docs/diagrams/ holds generated diagram HTML; it's build output, not source to
          # analyze.
          config: |
            paths-ignore:
              - docs/diagrams
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
